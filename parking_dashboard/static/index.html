<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Parking Dashboard</title>
<style>
    :root {
        --bg-1: #020303;
        --bg-2: #0d1013;
        --bg-3: #161b20;
        --panel: rgba(12, 14, 17, 0.72);
        --panel-soft: rgba(22, 24, 28, 0.84);
        --panel-strong: rgba(28, 31, 35, 0.96);
        --border: rgba(255, 255, 255, 0.12);
        --text: #f5f5f5;
        --muted: #c7ccd1;
        --muted-strong: #f0f0f0;
        --empty-color: #ffffff;
        --occupied-color: #d4d4d4;
        --shadow: 0 20px 45px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255,255,255,0.06);
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background:
            radial-gradient(circle at top left, rgba(255,255,255,0.12), transparent 22%),
            radial-gradient(circle at bottom right, rgba(255,255,255,0.05), transparent 30%),
            linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 42%, var(--bg-3) 100%);
        color: var(--text);
        padding: 32px 20px 24px;
    }

    .dashboard {
        max-width: 1200px;
        margin: 0 auto;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
        background: linear-gradient(180deg, rgba(15, 17, 19, 0.8), rgba(10, 12, 15, 0.9));
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 22px;
        padding: 24px 28px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        margin-bottom: 28px;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .brand-mark {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-size: 1.3rem;
        background: linear-gradient(135deg, #2a2a2a, #0f0f0f);
        border: 1px solid var(--border);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    h1 {
        margin: 0;
        font-size: clamp(1.6rem, 2.2vw, 2.4rem);
        font-weight: 700;
        letter-spacing: -0.04em;
    }

    .subtitle {
        color: var(--muted);
        font-size: 0.9rem;
        margin-top: 4px;
        letter-spacing: 0.02em;
    }

    .stats {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
    }

    .stat-card {
        background: linear-gradient(180deg, rgba(33, 36, 40, 0.94), rgba(15, 17, 20, 0.98));
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 14px 18px;
        text-align: center;
        min-width: 120px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 10px 24px rgba(0,0,0,0.3);
    }

    .stat-card .num {
        font-size: clamp(1.5rem, 2vw, 2rem);
        font-weight: 700;
        line-height: 1.1;
    }

    .stat-card .label {
        font-size: 0.7rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-top: 8px;
    }

    .stat-available .num { color: var(--empty-color); }
    .stat-occupied .num { color: var(--occupied-color); }
    .stat-total .num { color: var(--muted-strong); }

    #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 16px;
    }

    .spot {
        position: relative;
        background: linear-gradient(180deg, rgba(25, 28, 32, 0.96), rgba(12, 14, 17, 0.98));
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;
        padding: 18px 12px 14px;
        text-align: center;
        min-height: 128px;
        transition: transform 0.16s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 10px 24px rgba(0,0,0,0.25);
    }

    .spot:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 30px rgba(0,0,0,0.32);
    }

    .spot.empty { border-color: rgba(125, 211, 168, 0.45); }
    .spot.occupied { border-color: rgba(248, 113, 113, 0.45); }

    .spot .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        margin: 0 auto 12px;
        box-shadow: 0 0 20px currentColor;
    }

    .spot.empty .dot {
        background: var(--empty-color);
        color: var(--empty-color);
    }

    .spot.occupied .dot {
        background: var(--occupied-color);
        color: var(--occupied-color);
    }

    .spot .id {
        font-weight: 700;
        font-size: 1rem;
        letter-spacing: 0.03em;
    }

    .spot .label {
        font-size: 0.72rem;
        color: var(--muted);
        text-transform: capitalize;
        letter-spacing: 0.12em;
        margin-top: 6px;
    }

    .spot.empty .label { color: var(--empty-color); }
    .spot.occupied .label { color: var(--occupied-color); }

    #empty-state {
        color: var(--muted);
        text-align: center;
        padding: 74px 20px;
        border: 1px dashed rgba(255,255,255,0.18);
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(15,17,20,0.78), rgba(11,13,16,0.82));
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        margin-top: 12px;
    }

    code {
        color: var(--muted-strong);
        background: rgba(255,255,255,0.04);
        padding: 3px 6px;
        border-radius: 6px;
    }

    footer {
        margin-top: 26px;
        color: var(--muted);
        font-size: 0.78rem;
        text-align: center;
        letter-spacing: 0.04em;
    }
</style>
</head>
<body>

<div class="dashboard">
    <header>
        <div class="brand">
            <div class="brand-mark">P</div>
            <div>
                <h1>Parking Monitor</h1>
                <div class="subtitle" id="last-updated">Waiting for data...</div>
            </div>
        </div>
        <div class="stats">
            <div class="stat-card stat-available">
                <div class="num" id="stat-available">-</div>
                <div class="label">Available</div>
            </div>
            <div class="stat-card stat-occupied">
                <div class="num" id="stat-occupied">-</div>
                <div class="label">Occupied</div>
            </div>
            <div class="stat-card stat-total">
                <div class="num" id="stat-total">-</div>
                <div class="label">Total</div>
            </div>
        </div>
    </header>

    <div id="grid"></div>
    <div id="empty-state">
        No data available yet. <br>
        Run <code>push_live_status.py</code> or POST to <code>/api/status</code>.
    </div>

    <footer>Auto-refreshing every 3 seconds &middot; AI Parking Optimization</footer>
</div>

<script>
async function refreshStatus() {
    try {
        const res = await fetch('/api/status');
        const data = await res.json();

        document.getElementById('stat-available').textContent = data.available;
        document.getElementById('stat-occupied').textContent = data.occupied;
        document.getElementById('stat-total').textContent = data.total;
        document.getElementById('last-updated').textContent =
            data.last_updated ? `Last updated: ${data.last_updated}` : 'Waiting for data...';

        const grid = document.getElementById('grid');
        const emptyState = document.getElementById('empty-state');
        const spots = data.spots || {};
        const spotIds = Object.keys(spots);

        if (spotIds.length === 0) {
            grid.style.display = 'none';
            emptyState.style.display = 'block';
            return;
        }
        grid.style.display = 'grid';
        emptyState.style.display = 'none';

        grid.innerHTML = spotIds.map(id => {
            const status = spots[id];
            return `
                <div class="spot ${status}">
                    <div class="dot"></div>
                    <div class="id">${id}</div>
                    <div class="label">${status}</div>
                </div>
            `;
        }).join('');
    } catch (err) {
        console.error('Failed to fetch status', err);
    }
}

refreshStatus();
setInterval(refreshStatus, 3000);
</script>

</body>
</html>
