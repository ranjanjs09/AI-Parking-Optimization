<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Parking Dashboard</title>
<style>
    :root {
        --bg-1: #020303;
        --bg-2: #0d1013;
        --bg-3: #161b20;
        --panel: rgba(12, 14, 17, 0.72);
        --panel-soft: rgba(22, 24, 28, 0.84);
        --panel-strong: rgba(28, 31, 35, 0.96);
        --border: rgba(255, 255, 255, 0.12);
        --text: #f5f5f5;
        --muted: #c7ccd1;
        --muted-strong: #f0f0f0;
        --empty-color: #ffffff;
        --occupied-color: #d4d4d4;
        --shadow: 0 20px 45px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255,255,255,0.06);
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background:
            radial-gradient(circle at top left, rgba(255,255,255,0.12), transparent 22%),
            radial-gradient(circle at bottom right, rgba(255,255,255,0.05), transparent 30%),
            linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 42%, var(--bg-3) 100%);
        color: var(--text);
        padding: 32px 20px 24px;
    }

    .dashboard {
        max-width: 1200px;
        margin: 0 auto;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
        background: linear-gradient(180deg, rgba(15, 17, 19, 0.8), rgba(10, 12, 15, 0.9));
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 22px;
        padding: 24px 28px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        margin-bottom: 28px;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .brand-mark {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-size: 1.3rem;
        background: linear-gradient(135deg, #2a2a2a, #0f0f0f);
        border: 1px solid var(--border);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    h1 {
        margin: 0;
        font-size: clamp(1.6rem, 2.2vw, 2.4rem);
        font-weight: 700;
        letter-spacing: -0.04em;
    }

    .subtitle {
        color: var(--muted);
        font-size: 0.9rem;
        margin-top: 4px;
        letter-spacing: 0.02em;
    }

    .stats {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
    }

    .stat-card {
        background: linear-gradient(180deg, rgba(33, 36, 40, 0.94), rgba(15, 17, 20, 0.98));
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 14px 18px;
        text-align: center;
        min-width: 120px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 10px 24px rgba(0,0,0,0.3);
    }

    .stat-card .num {
        font-size: clamp(1.5rem, 2vw, 2rem);
        font-weight: 700;
        line-height: 1.1;
    }

    .stat-card .label {
        font-size: 0.7rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-top: 8px;
    }

    .stat-available .num { color: var(--empty-color); }
    .stat-occupied .num { color: var(--occupied-color); }
    .stat-total .num { color: var(--muted-strong); }
    .stat-reserved .num { color: #c4b5fd; }

    #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 16px;
    }

    .spot {
        position: relative;
        background: linear-gradient(180deg, rgba(25, 28, 32, 0.96), rgba(12, 14, 17, 0.98));
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;
        padding: 18px 12px 14px;
        text-align: center;
        min-height: 128px;
        transition: transform 0.16s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 10px 24px rgba(0,0,0,0.25);
    }

    .spot:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 30px rgba(0,0,0,0.32);
    }

    .spot.empty { border-color: rgba(125, 211, 168, 0.45); }
    .spot.occupied { border-color: rgba(248, 113, 113, 0.45); }

    .spot .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        margin: 0 auto 12px;
        box-shadow: 0 0 20px currentColor;
    }

    .spot.empty .dot {
        background: var(--empty-color);
        color: var(--empty-color);
    }

    .spot.occupied .dot {
        background: var(--occupied-color);
        color: var(--occupied-color);
    }

    .spot .id {
        font-weight: 700;
        font-size: 1rem;
        letter-spacing: 0.03em;
    }

    .spot .label {
        font-size: 0.72rem;
        color: var(--muted);
        text-transform: capitalize;
        letter-spacing: 0.12em;
        margin-top: 6px;
    }

    .spot.empty .label { color: var(--empty-color); }
    .spot.occupied .label { color: var(--occupied-color); }
    .spot.reserved { border-color: rgba(196, 181, 253, 0.65); }
    .spot .booking-info {
        color: #c4b5fd;
        font-size: 0.72rem;
        margin-top: 8px;
        overflow-wrap: anywhere;
    }
    .spot-action {
        margin-top: 12px;
        padding: 8px 12px;
        border-radius: 9px;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.07);
        color: var(--text);
        font: inherit;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
    }
    .spot-action:hover { background: rgba(255,255,255,0.14); }
    .spot-action:disabled { opacity: 0.55; cursor: wait; }

    #booking-notice {
        min-height: 1.4em;
        margin: 14px 0;
        color: #c4b5fd;
        font-size: 0.88rem;
    }

    dialog {
        width: min(420px, calc(100% - 32px));
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: linear-gradient(180deg, #1c2024, #0d1013);
        color: var(--text);
        box-shadow: var(--shadow);
    }
    dialog::backdrop { background: rgba(0,0,0,0.72); backdrop-filter: blur(5px); }
    .booking-form { padding: 24px; }
    .booking-form h2 { margin: 0 0 8px; }
    .booking-form p { color: var(--muted); margin: 0 0 20px; }
    .booking-form label { display: block; font-size: 0.85rem; margin-bottom: 8px; }
    .booking-form input {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(0,0,0,0.28);
        color: var(--text);
        font: inherit;
    }
    .booking-form input:focus { outline: 2px solid #c4b5fd; outline-offset: 1px; }
    .booking-form .form-error { min-height: 1.2em; color: #fca5a5; font-size: 0.82rem; margin-top: 10px; }
    .booking-form .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }

    #empty-state {
        color: var(--muted);
        text-align: center;
        padding: 74px 20px;
        border: 1px dashed rgba(255,255,255,0.18);
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(15,17,20,0.78), rgba(11,13,16,0.82));
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        margin-top: 12px;
    }

    code {
        color: var(--muted-strong);
        background: rgba(255,255,255,0.04);
        padding: 3px 6px;
        border-radius: 6px;
    }

    footer {
        margin-top: 26px;
        color: var(--muted);
        font-size: 0.78rem;
        text-align: center;
        letter-spacing: 0.04em;
    }
</style>
</head>
<body>

<div class="dashboard">
    <header>
        <div class="brand">
            <div class="brand-mark">P</div>
            <div>
                <h1>Parking Monitor</h1>
                <div class="subtitle" id="last-updated">Waiting for data...</div>
            </div>
        </div>
        <div class="stats">
            <div class="stat-card stat-available">
                <div class="num" id="stat-available">-</div>
                <div class="label">Bookable</div>
            </div>
            <div class="stat-card stat-occupied">
                <div class="num" id="stat-occupied">-</div>
                <div class="label">Occupied</div>
            </div>
            <div class="stat-card stat-reserved">
                <div class="num" id="stat-reserved">-</div>
                <div class="label">Reserved</div>
            </div>
            <div class="stat-card stat-total">
                <div class="num" id="stat-total">-</div>
                <div class="label">Total</div>
            </div>
        </div>
    </header>

    <div id="grid"></div>
    <div id="booking-notice" role="status" aria-live="polite"></div>
    <div id="empty-state">
        No data available yet. <br>
        Run <code>push_live_status.py</code> or POST to <code>/api/status</code>.
    </div>

    <footer>Auto-refreshing every 3 seconds &middot; AI Parking Optimization</footer>
</div>

<dialog id="booking-modal" aria-labelledby="booking-title">
    <form class="booking-form" id="booking-form">
        <h2 id="booking-title">Reserve a parking spot</h2>
        <p id="booking-description"></p>
        <label for="booking-name">Your name</label>
        <input id="booking-name" name="name" maxlength="80" autocomplete="name" required>
        <div class="form-error" id="booking-error" role="alert"></div>
        <div class="form-actions">
            <button class="spot-action" type="button" id="booking-close">Cancel</button>
            <button class="spot-action" type="submit">Confirm booking</button>
        </div>
    </form>
</dialog>

<script>
let currentBookings = {};
let selectedSpotId = null;

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    })[character]);
}

function openBooking(spotId) {
    selectedSpotId = spotId;
    document.getElementById('booking-description').textContent = `Reserve ${spotId} now.`;
    document.getElementById('booking-error').textContent = '';
    document.getElementById('booking-name').value = '';
    document.getElementById('booking-modal').showModal();
    document.getElementById('booking-name').focus();
}

function showBookingNotice(message) {
    document.getElementById('booking-notice').textContent = message;
}

async function cancelBooking(spotId) {
    try {
        const response = await fetch(`/api/bookings/${encodeURIComponent(spotId)}`, { method: 'DELETE' });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Unable to cancel booking');
        await refreshStatus();
        showBookingNotice(`Booking for ${spotId} cancelled.`);
    } catch (err) {
        console.error('Failed to cancel booking', err);
        showBookingNotice(err.message);
    }
}

document.getElementById('booking-close').addEventListener('click', () => {
    document.getElementById('booking-modal').close();
});

document.getElementById('booking-form').addEventListener('submit', async event => {
    event.preventDefault();
    const spotId = selectedSpotId;
    const errorElement = document.getElementById('booking-error');
    const submitButton = event.currentTarget.querySelector('button[type="submit"]');
    submitButton.disabled = true;
    errorElement.textContent = '';
    try {
        const response = await fetch('/api/bookings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                spot_id: spotId,
                name: document.getElementById('booking-name').value
            })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Unable to book parking spot');
        document.getElementById('booking-modal').close();
        await refreshStatus();
        showBookingNotice(`${spotId} booked successfully.`);
    } catch (err) {
        errorElement.textContent = err.message;
    } finally {
        submitButton.disabled = false;
    }
});

async function refreshStatus() {
    try {
        const [statusResponse, bookingsResponse] = await Promise.all([
            fetch('/api/status'),
            fetch('/api/bookings')
        ]);
        if (!statusResponse.ok || !bookingsResponse.ok) throw new Error('Unable to load parking data');
        const data = await statusResponse.json();
        currentBookings = await bookingsResponse.json();

        const spots = data.spots || {};
        const spotIds = Object.keys(spots);
        const availableCount = spotIds.filter(id => spots[id] === 'empty' && !currentBookings[id]).length;
        document.getElementById('stat-available').textContent = availableCount;
        document.getElementById('stat-occupied').textContent = data.occupied;
        document.getElementById('stat-reserved').textContent = Object.keys(currentBookings).length;
        document.getElementById('stat-total').textContent = data.total;
        document.getElementById('last-updated').textContent =
            data.last_updated ? `Last updated: ${data.last_updated}` : 'Waiting for data...';

        const grid = document.getElementById('grid');
        const emptyState = document.getElementById('empty-state');

        if (spotIds.length === 0) {
            grid.style.display = 'none';
            emptyState.style.display = 'block';
            return;
        }
        grid.style.display = 'grid';
        emptyState.style.display = 'none';

        grid.innerHTML = spotIds.map(id => {
            const status = spots[id];
            const booking = currentBookings[id];
            const safeId = escapeHtml(id);
            const bookingInfo = booking
                ? `<div class="booking-info">Reserved by ${escapeHtml(booking.name)}</div>`
                : '';
            const action = booking
                ? `<button class="spot-action cancel-booking" data-spot-id="${safeId}">Cancel booking</button>`
                : status === 'empty'
                    ? `<button class="spot-action book-spot" data-spot-id="${safeId}">Book this spot</button>`
                    : '';
            return `
                <div class="spot ${status === 'occupied' ? 'occupied' : 'empty'} ${booking ? 'reserved' : ''}">
                    <div class="dot"></div>
                    <div class="id">${safeId}</div>
                    <div class="label">${booking ? 'Reserved' : escapeHtml(status)}</div>
                    ${bookingInfo}
                    ${action}
                </div>
            `;
        }).join('');
        grid.querySelectorAll('.book-spot').forEach(button => {
            button.addEventListener('click', () => openBooking(button.dataset.spotId));
        });
        grid.querySelectorAll('.cancel-booking').forEach(button => {
            button.addEventListener('click', () => cancelBooking(button.dataset.spotId));
        });
    } catch (err) {
        console.error('Failed to fetch status', err);
    }
}

refreshStatus();
setInterval(refreshStatus, 3000);
</script>

</body>
</html>
